# Modèles proposés dans le sélecteur de la barre de saisie (section 8).
# Les casquettes appellent toujours la passerelle, jamais un fournisseur en direct.
model_list:
  - model_name: claude-opus
    litellm_params:
      model: anthropic/claude-opus-5-5
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: claude-sonnet
    litellm_params:
      model: anthropic/claude-sonnet-5-5
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: gpt
    litellm_params:
      model: openai/gpt-5
      api_key: os.environ/OPENAI_API_KEY
  # Flash : le modèle Gemini le plus généreux en usage gratuit (clé AI Studio).
  - model_name: gemini
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY
  - model_name: mistral
    litellm_params:
      model: mistral/mistral-large-latest
      api_key: os.environ/MISTRAL_API_KEY
  # Modèle local, gratuit et sans clé : Ollama sur la machine hôte. Lent sans carte graphique.
  - model_name: local
    litellm_params:
      model: ollama_chat/qwen2.5-coder:3b
      api_base: os.environ/OLLAMA_API_BASE
      # Ollama tronque sans prévenir au-delà de 4 096 tokens par défaut : le dossier d'une
      # casquette (référentiel, projet, fil) est plus long.
      num_ctx: 16384

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

# Ignorer les paramètres qu'un fournisseur ne connaît pas (ex. parallel_tool_calls pour Ollama)
# plutôt que d'échouer : les casquettes restent indépendantes du fournisseur.
litellm_settings:
  drop_params: true
