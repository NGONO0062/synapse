<!doctype html><html lang="fr"><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&family=Sora:wght@500;600&display=swap" rel="stylesheet">

<style>
body{margin:0;background:#101114}
a{color:#AEB7FF}a:hover{color:#CDD3FF}
input::placeholder{color:#7D828D}
</style>
</head><body>

<div style="min-height: 100vh; box-sizing: border-box; padding: 48px 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; background: #101114; color: #F2F3F5; font-family: 'Manrope', system-ui, sans-serif; font-size: 15px; line-height: 1.5">

<div style="display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center">
<img src="../../public/logo-light.png" alt="" style="width: 72px; height: 72px; object-fit: contain">
<h1 style="margin: 0; font-family: 'Sora', system-ui, sans-serif; font-size: 40px; font-weight: 600; letter-spacing: -0.01em">Synapse</h1>
<p style="margin: 0; max-width: 380px; color: #9BA0AB; font-size: 16px">Ton équipe logicielle IA. Elle propose, tu valides.</p>
</div>

<form style="width: 100%; max-width: 400px; box-sizing: border-box; padding: 28px; border: 1px solid #2A2D35; border-radius: 26px; background: #17181C; display: flex; flex-direction: column; gap: 16px">
<button type="button" style="display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 46px; border: 1px solid #353943; border-radius: 999px; background: #101114; color: #F2F3F5; font-family: inherit; font-size: 15px; font-weight: 500; cursor: pointer">
<svg aria-hidden="true" width="17" height="17" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2.5" y="3.5" width="13" height="11" rx="2"></rect><path d="M2.5 5l6.5 5 6.5-5"></path></svg>
Continuer avec le compte de l’entreprise (SSO)</button>

<div style="display: flex; align-items: center; gap: 12px; color: #9BA0AB; font-size: 13px">
<span aria-hidden="true" style="flex: 1; height: 1px; background: #2A2D35"></span>ou<span aria-hidden="true" style="flex: 1; height: 1px; background: #2A2D35"></span>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<label for="email" style="font-size: 14px; font-weight: 500">E-mail</label>
<input id="email" type="email" autocomplete="email" placeholder="nom@entreprise.com" style="height: 46px; box-sizing: border-box; padding: 0 14px; border: 1px solid #353943; border-radius: 14px; background: #101114; color: #F2F3F5; font-family: inherit; font-size: 15px">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<label for="mdp" style="font-size: 14px; font-weight: 500">Mot de passe</label>
<a href="#" style="font-size: 13px">Mot de passe oublié ?</a>
</div>
<input id="mdp" type="password" autocomplete="current-password" style="height: 46px; box-sizing: border-box; padding: 0 14px; border: 1px solid #353943; border-radius: 14px; background: #101114; color: #F2F3F5; font-family: inherit; font-size: 15px">
</div>

<a href="Accueil.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 46px; border-radius: 999px; background: #F2F3F5; color: #0A0B0D; text-decoration: none; font-size: 15px; font-weight: 600">Se connecter</a>
</form>

<p style="margin: 0; color: #9BA0AB; font-size: 13px; text-align: center">Pas encore de compte ? Demande une invitation à l’administrateur de ton espace.</p>
</div>
</body></html>
